<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <style>
        .grid-page {
            display: grid;
            grid-template-columns: 200px 1fr 200px; /* 左中右 */
            grid-template-rows: auto 1fr auto;      /* 上中下 */
            grid-template-areas:
            "header  header  header"
            "sidebar main    aside"
            "footer  footer  footer";
            min-height: 100vh;
        }
        
        header { grid-area: header; background: #999; padding: 1rem; text-align: center; }
        .sidebar { grid-area: sidebar; background: #ddd; }
        .main { grid-area: main; background: #eee; }
        .aside { grid-area: aside; background: #ccc; }
        footer { grid-area: footer; background: #999; padding: 1rem; text-align: center; }
    </style>
</head>

<body>
    <div class="grid-page">
        <header>Header</header>
        <aside class="sidebar">Sidebar</aside>
        <main>Main</main>
        <aside class="aside">Aside</aside>
        <footer>Footer</footer>
      </div>
</body>
